name: iOS TestFlight

# Every push that changes the iPhone app, or the engine it is built on, uploads a
# new build to TestFlight (ios/testflight.sh). The build number is the count of
# commits, so each is higher than the last.
#
# Needs these repository secrets: ASC_KEY_ID and ASC_ISSUER_ID (an App Store Connect
# API key's id and its issuer) and ASC_KEY_P8_B64 (the key's .p8 file, base64) for
# the upload; BUILD_CERT_P12_B64 and BUILD_CERT_PASSWORD (the team's Apple
# Distribution certificate with its key, as a .p12, base64, and its password) and
# PP_APP_B64 (the "FastPlay App Store CI" provisioning profile, base64) for signing.
# The same certificate FastSMRW's builds are signed with.

on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'ci/ffmpeg/**'
      - 'download-deps.sh'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

# One upload at a time, in order: build numbers only go up
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit: their count is the build number

      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download dependencies
        run: |
          chmod +x download-deps.sh
          ./download-deps.sh

      # FastPlay's audio-only FFmpeg for the iPhone, built again only when its
      # build or patches change
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-ios
          key: ffmpeg-ios-${{ hashFiles('ci/ffmpeg/**') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: JOBS="$(sysctl -n hw.ncpu)" bash ci/ffmpeg/build.sh ios ffmpeg-ios

      # The engine's own build, and the libraries CMake fetches for it, kept
      # between runs
      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: ios/build/core-iphoneos
          key: ios-core-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ios-core-

      # One certificate, reused every run, in a keychain of its own. (Automatic
      # signing made a new certificate on each run, there being none on the runner.)
      - name: Install the signing certificate and profile
        env:
          BUILD_CERT_P12_B64: ${{ secrets.BUILD_CERT_P12_B64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PP_APP_B64: ${{ secrets.PP_APP_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          # Searched along with the runner's own keychains
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/[" ]//g')
          echo "$BUILD_CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          # codesign may use the key without asking
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          # The profile, in both places Xcode looks
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            echo "$PP_APP_B64" | base64 -d > "$DIR/fastplay-app.mobileprovision"
          done

      - name: Install the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ios/testflight.sh

      - name: Remove the key, certificate and profile
        if: always()
        run: |
          rm -rf ~/.appstoreconnect
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/fastplay-app.mobileprovision
          rm -f ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/fastplay-app.mobileprovision
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
